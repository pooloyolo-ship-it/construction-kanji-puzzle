<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163f36"><title>建設用語パズル｜初級・中級・上級9ステージ</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./css/style.css"><script type="module" src="./js/app.js"></script></head>
<body>
<section id="selection-screen" class="selection-screen" aria-labelledby="selection-title">
  <p class="selection-label">5 × 5 / 初級</p><h1 id="selection-title" tabindex="-1">建設用語パズル</h1>
  <p class="selection-subtitle">毎回ちがう問題に挑戦</p><div id="stage-buttons" class="stage-buttons"></div><p id="generation-status" role="status"></p>
</section>
<section id="play-screen" class="play-screen" hidden>
  <header class="play-header"><h1>建設用語パズル</h1><span id="stage-name" class="stage-label">STAGE 1</span></header>
  <main class="play-area"><div id="board" class="board" role="group" aria-label="5行5列の漢字盤面" aria-busy="false"></div></main>
  <p id="hint-message" class="hint-message" role="status"></p>
  <nav class="controls" aria-label="ゲーム操作"><button id="undo" disabled>↶ 一手戻す</button><button id="reset" disabled>↻ 最初から</button><button id="hint" hidden>ヒント</button><button id="new-problem">新しい問題</button></nav>
  <button id="back-to-selection" class="selection-back">ステージ選択へ戻る</button>
</section>
<section id="clear-screen" class="clear-screen" hidden aria-labelledby="clear-title">
  <header class="clear-heading"><span class="clear-mark" aria-hidden="true">✓</span><p id="clear-stage"></p><h2 id="clear-title" tabindex="-1">STAGE CLEAR!</h2><p>完成させた現場のことば</p></header>
  <div id="learned" class="learned"></div>
  <nav class="clear-controls" aria-label="クリア後の操作"><button id="replay">新しい問題でもう一度</button><button id="next" class="primary">次のステージ →</button><button id="clear-selection">ステージ選択へ</button><button id="clear-undo">↶ 一手戻す</button></nav>
</section>
<p id="status" class="sr-only" role="status" aria-live="polite"></p><p id="error" class="error" hidden role="alert"></p>
<dialog id="dead-end-warning" aria-labelledby="warning-title" aria-describedby="warning-message">
  <h2 id="warning-title">別の並べ方を考えてみましょう</h2>
  <p id="warning-message">この用語を消すと、残りの文字ではクリアできなくなります。<br>別の並べ方を考えてみましょう。</p>
  <p class="warning-note">文字を移動前の位置に戻しました。</p>
  <form method="dialog"><button autofocus>盤面に戻る</button></form>
</dialog>
<noscript>JavaScriptを有効にしてください。</noscript>
</body></html>
